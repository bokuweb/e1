[package]
name = "e1"
version = "0.0.0"
edition = "2024"
description = "A native GitHub client, built to stand alone and to be embedded in Ginka"
publish = false

[workspace]
members = [
    "crates/e1-github",
    "crates/e1-ui",
    "crates/e1-views",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
e1-github = { path = "crates/e1-github" }
e1-ui = { path = "crates/e1-ui" }
e1-views = { path = "crates/e1-views" }

# GPUI arrives transitively through gpui-component: the component library owns
# the rev, and pinning it independently guarantees a conflict on the next
# toolkit upgrade. The lock file pins both to the revs Ginka is built against,
# which is what lets `e1-views` be linked into Ginka's window (docs/roadmap.md
# §4.3): two revs of `gpui` are two unrelated sets of types.
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# The matcher for the file finder: small, pure Rust, the one Helix and Zed use.
nucleo-matcher = "0.3"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking HTTP over rustls, run on GPUI's background executor. Chosen over an
# async client because every async client on crates.io brings tokio, and Ginka
# runs on smol: a second reactor in the embedding process is the one thing
# the host forbids (its AGENTS.md § Conventions).
ureq = { version = "3", features = ["json"] }

[dependencies]
e1-github.workspace = true
e1-ui.workspace = true
e1-views.workspace = true
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
rust-i18n.workspace = true
tracing.workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[lints]
workspace = true
